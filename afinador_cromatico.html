<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Afinador Cromático</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--card:#101d31;--accent:#42e8a4;--warn:#ffc857;--muted:#91a4be}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#183255,#07111f 55%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;display:grid;place-items:center;padding:18px}.app{width:min(100%,480px)}h1{font-size:1.35rem;text-align:center;margin:0 0 14px}.card{background:rgba(16,29,49,.94);border:1px solid #28415f;border-radius:26px;padding:24px;box-shadow:0 22px 60px #0008}.note{text-align:center;font-size:6rem;font-weight:800;line-height:1;margin:10px 0}.freq{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}.meter{height:18px;border-radius:999px;background:linear-gradient(90deg,#ef476f 0 37%,#ffc857 43%,#42e8a4 48% 52%,#ffc857 57%,#ef476f 63%);position:relative;margin:34px 0 12px}.needle{position:absolute;left:50%;top:-12px;width:4px;height:42px;background:white;border-radius:9px;box-shadow:0 0 12px #fff;transform:translateX(-50%);transition:left .08s}.cents{text-align:center;font-size:1.5rem;font-weight:700}.hint{text-align:center;color:var(--muted);min-height:24px;margin:8px 0 20px}button{width:100%;border:0;border-radius:18px;padding:16px;font-size:1rem;font-weight:800;background:var(--accent);color:#052116}.small{font-size:.78rem;color:var(--muted);text-align:center;margin-top:14px;line-height:1.4}.ok{color:var(--accent)}
</style></head><body><main class="app"><h1>Afinador cromático</h1><section class="card"><div id="note" class="note">--</div><div id="freq" class="freq">Toque ou cante uma nota</div><div class="meter"><div id="needle" class="needle"></div></div><div id="cents" class="cents">0 cents</div><div id="hint" class="hint">Permita o acesso ao microfone</div><button id="start">Ativar microfone</button><div class="small">Afinação de referência: Lá4 = 440 Hz. Funciona melhor em ambiente silencioso e com uma nota por vez.</div></section></main>
<script>
const noteEl=document.querySelector('#note'),freqEl=document.querySelector('#freq'),needle=document.querySelector('#needle'),centsEl=document.querySelector('#cents'),hint=document.querySelector('#hint'),btn=document.querySelector('#start');
const names=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B']; let ctx,analyser,running=false;
function autoCorrelate(buf,rate){let size=buf.length,rms=0;for(const v of buf)rms+=v*v;rms=Math.sqrt(rms/size);if(rms<.01)return -1;let best=-1,bestCorr=0;for(let off=18;off<Math.min(1200,size/2);off++){let corr=0;for(let i=0;i<size-off;i++)corr+=Math.abs(buf[i]-buf[i+off]);corr=1-corr/(size-off);if(corr>bestCorr){bestCorr=corr;best=off}}return bestCorr>.88?rate/best:-1}
function tick(){if(!running)return;const b=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(b);const f=autoCorrelate(b,ctx.sampleRate);if(f>30&&f<2000){const n=Math.round(69+12*Math.log2(f/440)),target=440*Math.pow(2,(n-69)/12),c=Math.round(1200*Math.log2(f/target)),name=names[(n%12+12)%12]+(Math.floor(n/12)-1);noteEl.textContent=name;freqEl.textContent=f.toFixed(1)+' Hz';centsEl.textContent=(c>0?'+':'')+c+' cents';needle.style.left=(50+Math.max(-50,Math.min(50,c))).toFixed(1)+'%';if(Math.abs(c)<=5){hint.textContent='Afinado';hint.className='hint ok'}else{hint.textContent=c<0?'Aumente a afinação':'Diminua a afinação';hint.className='hint'}}else{noteEl.textContent='--';freqEl.textContent='Aguardando uma nota clara';hint.textContent='Toque ou cante uma nota sustentada';needle.style.left='50%'}requestAnimationFrame(tick)}
btn.onclick=async()=>{try{if(running){running=false;await ctx.close();btn.textContent='Ativar microfone';return}const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new (window.AudioContext||window.webkitAudioContext)();analyser=ctx.createAnalyser();analyser.fftSize=4096;ctx.createMediaStreamSource(stream).connect(analyser);running=true;btn.textContent='Desativar microfone';tick()}catch(e){hint.textContent='Não foi possível acessar o microfone. Use HTTPS e permita o acesso.'}};
</script></body></html>
