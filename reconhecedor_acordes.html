<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>Reconhecedor de Acordes</title><style>:root{color-scheme:dark;--a:#7c5cff;--bg:#0b1020;--card:#151d35;--m:#a6b2cb}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#30245e,#0b1020 60%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff;display:grid;place-items:center;padding:18px}.app{width:min(100%,520px)}h1{text-align:center;font-size:1.35rem}.card{background:#151d35f2;border:1px solid #3b4668;border-radius:26px;padding:22px;box-shadow:0 25px 70px #0009}.label{text-align:center;color:var(--m)}.chord{text-align:center;font-size:5rem;font-weight:900;margin:10px 0}.confidence{text-align:center;color:#c4baff;min-height:24px}.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;height:120px;align-items:end;margin:28px 0 8px}.bar{background:linear-gradient(#a996ff,#6346fb);border-radius:6px 6px 2px 2px;min-height:3px;transition:height .18s}.names{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;font-size:.62rem;text-align:center;color:var(--m)}button{width:100%;border:0;border-radius:18px;padding:16px;background:var(--a);color:#fff;font-size:1rem;font-weight:850;margin-top:24px}.small{font-size:.78rem;color:var(--m);line-height:1.45;text-align:center;margin-top:14px}</style></head><body><main class="app"><h1>Reconhecedor de Acordes</h1><section class="card"><div class="label">Acorde principal detectado</div><div id="chord" class="chord">--</div><div id="confidence" class="confidence">Permita o acesso ao microfone</div><div id="bars" class="bars"></div><div id="names" class="names"></div><button id="start">Ouvir acorde</button><div class="small">Toque o acorde completo por 1 a 2 segundos. A leitura combina várias amostras e só troca o resultado quando o novo acorde permanece dominante.</div></section></main><script>
const notes=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],bars=document.querySelector('#bars'),names=document.querySelector('#names'),out=document.querySelector('#chord'),conf=document.querySelector('#confidence'),btn=document.querySelector('#start');notes.forEach(n=>{bars.insertAdjacentHTML('beforeend','<div class="bar"></div>');names.insertAdjacentHTML('beforeend','<div>'+n+'</div>')});const barEls=[...bars.children];let ctx,an,stream,running=false,avg=Array(12).fill(0),candidate='',candidateFrames=0,current='',silenceFrames=0;
function scoreChords(ch){let best={score:-9,name:'--'},second=-9;for(let r=0;r<12;r++){for(const t of [{s:'',a:[0,4,7]},{s:'m',a:[0,3,7]}]){const tones=t.a.map(i=>(r+i)%12),inside=tones.reduce((s,i)=>s+ch[i],0)/3,bass=ch[r]*.08,outside=ch.reduce((s,v,i)=>tones.includes(i)?s:s+v,0)/9,score=inside+bass-.28*outside;if(score>best.score){second=best.score;best={score,name:notes[r]+t.s}}else if(score>second)second=score}}}best.margin=best.score-second;return best}
function analyze(){if(!running)return;const data=new Float32Array(an.frequencyBinCount);an.getFloatFrequencyData(data);const chroma=Array(12).fill(0);let energy=0;for(let i=3;i<data.length;i++){const f=i*ctx.sampleRate/an.fftSize;if(f<65||f>1800)continue;const amp=Math.pow(10,data[i]/20);if(amp<.000015)continue;const midi=69+12*Math.log2(f/440),p=((Math.round(midi)%12)+12)%12;chroma[p]+=amp;energy+=amp}const max=Math.max(...chroma,1e-9),norm=chroma.map(v=>v/max);avg=avg.map((v,i)=>v*.88+norm[i]*.12);const amax=Math.max(...avg,1e-9),display=avg.map(v=>v/amax);display.forEach((v,i)=>barEls[i].style.height=(3+v*117)+'px');if(energy<.002){silenceFrames++;if(silenceFrames>30){out.textContent='--';conf.textContent='Toque um acorde sustentado';candidate='';candidateFrames=0}}else{silenceFrames=0;const best=scoreChords(display),quality=Math.round(Math.max(0,Math.min(99,(best.score*.72+best.margin*1.6)*100)));if(best.name===candidate)candidateFrames++;else{candidate=best.name;candidateFrames=1}if(candidateFrames>=14&&quality>=34){current=candidate;out.textContent=current}conf.textContent=current?'Estabilidade da leitura: '+quality+'%':'Analisando... mantenha o acorde soando'}requestAnimationFrame(analyze)}
btn.onclick=async()=>{try{if(running){running=false;stream.getTracks().forEach(t=>t.stop());await ctx.close();btn.textContent='Ouvir acorde';return}stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1}});ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=.82;ctx.createMediaStreamSource(stream).connect(an);running=true;avg.fill(0);current='';candidate='';candidateFrames=0;btn.textContent='Parar';analyze()}catch(e){conf.textContent='Sem acesso ao microfone. Verifique a permissão do navegador.'}};
</script></body></html>
