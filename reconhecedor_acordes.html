<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reconhecedor de Acordes</title>
<style>:root{color-scheme:dark;--a:#7c5cff;--b:#0b1020;--c:#151d35;--m:#9caaca}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#30245e,#0b1020 58%);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;display:grid;place-items:center;padding:18px}.app{width:min(100%,500px)}h1{text-align:center;font-size:1.4rem}.card{background:#151d35ee;border:1px solid #384363;border-radius:26px;padding:24px;box-shadow:0 25px 70px #0009}.label{text-align:center;color:var(--m)}.chord{text-align:center;font-size:5rem;font-weight:900;margin:10px 0}.confidence{text-align:center;color:#b5a8ff;min-height:24px}.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;height:120px;align-items:end;margin:28px 0 10px}.bar{background:linear-gradient(#9f8cff,#6346fb);border-radius:6px 6px 2px 2px;min-height:3px}.names{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;font-size:.62rem;text-align:center;color:var(--m)}button{width:100%;border:0;border-radius:18px;padding:16px;background:var(--a);color:#fff;font-size:1rem;font-weight:800;margin-top:24px}.small{font-size:.78rem;color:var(--m);line-height:1.45;text-align:center;margin-top:14px}</style></head>
<body><main class="app"><h1>Reconhecedor de acorde principal</h1><section class="card"><div class="label">Acorde detectado</div><div id="chord" class="chord">--</div><div id="confidence" class="confidence">Permita o acesso ao microfone</div><div id="bars" class="bars"></div><div id="names" class="names"></div><button id="start">Ouvir acorde</button><div class="small">Toque o acorde por 1 a 2 segundos. A análise reconhece tríades maiores e menores. Celulares funcionam melhor com poucos ruídos e o instrumento próximo ao microfone.</div></section></main>
<script>
const N=['C','C♯','D','D♯','E','F','F♯','G','G♯','A','A♯','B'],bars=document.querySelector('#bars'),names=document.querySelector('#names');N.forEach(n=>{bars.insertAdjacentHTML('beforeend','<div class="bar"></div>');names.insertAdjacentHTML('beforeend','<div>'+n+'</div>')});const bs=[...bars.children],out=document.querySelector('#chord'),conf=document.querySelector('#confidence'),btn=document.querySelector('#start');let ctx,an,run=false,hist=[];
function analyze(){if(!run)return;const data=new Float32Array(an.frequencyBinCount);an.getFloatFrequencyData(data);const chroma=Array(12).fill(0);for(let i=2;i<data.length;i++){const f=i*ctx.sampleRate/an.fftSize;if(f<70||f>1800)continue;const midi=Math.round(69+12*Math.log2(f/440)),p=(midi%12+12)%12,amp=Math.pow(10,data[i]/20);chroma[p]+=amp;}const max=Math.max(...chroma,1e-9),norm=chroma.map(x=>x/max);norm.forEach((v,i)=>bs[i].style.height=(3+v*117)+'px');let best={s:-1,name:'--'};for(let r=0;r<12;r++){for(const type of [{n:'',ints:[0,4,7]},{n:'m',ints:[0,3,7]}]){const inside=type.ints.reduce((s,j)=>s+norm[(r+j)%12],0)/3;const outside=norm.reduce((s,v,i)=>type.ints.includes((i-r+12)%12)?s:s+v,0)/9;const score=inside-.35*outside;if(score>best.s)best={s:score,name:N[r]+type.n}}}if(chroma.reduce((a,b)=>a+b,0)>.0001){hist.push(best.name);if(hist.length>8)hist.shift();const mode=hist.sort((a,b)=>hist.filter(x=>x===a).length-hist.filter(x=>x===b).length).pop();out.textContent=mode;conf.textContent='Confiança aproximada: '+Math.max(0,Math.min(99,Math.round(best.s*100)))+'%'}else{out.textContent='--';conf.textContent='Toque um acorde sustentado'}requestAnimationFrame(analyze)}
btn.onclick=async()=>{try{if(run){run=false;await ctx.close();btn.textContent='Ouvir acorde';return}const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});ctx=new (window.AudioContext||window.webkitAudioContext)();an=ctx.createAnalyser();an.fftSize=8192;an.smoothingTimeConstant=.75;ctx.createMediaStreamSource(stream).connect(an);run=true;btn.textContent='Parar';analyze()}catch(e){conf.textContent='Sem acesso ao microfone. Abra por HTTPS e permita o acesso.'}};
</script></body></html>
